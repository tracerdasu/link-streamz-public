name: Sync content from private data repo

on:
  # Fires when the admin panel pushes new content
  repository_dispatch:
    types: [sync-content]
  # Safety net: also runs every 30 minutes in case a dispatch was missed
  schedule:
    - cron: '*/30 * * * *'
  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Fetch content.json from private repo
        env:
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
        run: |
          curl -sS -f \
            -H "Authorization: token $DATA_REPO_PAT" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/traceradasu/link-streamz-data/contents/content.json" \
            -o content.json
          echo "Fetched $(wc -c < content.json) bytes"

      - name: Commit if changed
        run: |
          git config user.name "link-streamz-sync"
          git config user.email "sync@users.noreply.github.com"
          git add content.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync content from admin panel"
            git push
          fi
